name: fmi-web

services:
  web:
    image: fmi-web:local
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      args:
        NEXT_STANDALONE: ${NEXT_STANDALONE:-true}
    restart: unless-stopped
    init: true
    network_mode: bridge
    environment:
      LARAVEL_API_URL: ${LARAVEL_API_URL:-http://host.docker.internal:8000/api/v1}
      NEXT_TELEMETRY_DISABLED: "1"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      MAX_MEMORY_RESTART: ${MAX_MEMORY_RESTART:-512M}
    ports:
      - "${APP_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
